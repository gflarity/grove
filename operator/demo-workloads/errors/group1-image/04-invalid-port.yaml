# ErrImagePull - Invalid Registry Port
# Demonstrates error when registry port is invalid
# Expected: Connection refused or invalid port error
#
# QUICK START:
# 1. Apply this scenario:
#    kubectl apply -f 04-invalid-port.yaml
#
# 2. Check pod status:
#    kubectl get pods -l app.kubernetes.io/part-of=image-error-invalid-port
#
# 3. View the error details:
#    kubectl describe pod <pod-name> | grep -A 5 Events
#
# 4. Check PodCliqueSet status:
#    kubectl get pcs image-error-invalid-port -o yaml | grep -A 10 lastErrors
#
# 5. (Optional) Use grovectl for better output:
#    grovectl describe pcs image-error-invalid-port
#
# 6. Clean up:
#    kubectl delete pcs image-error-invalid-port
#
# EXPECTED BEHAVIOR:
# - Pods will show ImagePullBackOff state
# - Error message will indicate connection refused or invalid port
# - PCS status.operationalSummary.phase will be 'Degraded'
# - status.lastErrors will contain connection error details
---
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: image-error-invalid-port
  namespace: default
  labels:
    app: image-error-invalid-port
    demo: group1-image
    scenario: 04-invalid-port
spec:
  replicas: 1
  template:
    cliques:
      # PodClique with invalid registry port - blocks gang scheduling
      - name: app
        spec:
          roleName: app
          replicas: 2
          podSpec:
            containers:
              - name: app
                # Invalid registry port (port 99999 doesn't exist)
                image: localhost:99999/nginx:latest
                ports:
                  - containerPort: 8080
                    name: http
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
      # Healthy PodClique - schedule-gated waiting for gang
      - name: sidecar
        spec:
          roleName: sidecar
          replicas: 1
          podSpec:
            containers:
              - name: sidecar
                image: nginx:latest
                ports:
                  - containerPort: 80
                    name: http
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
