# Gang Scheduling Blocked - High Memory Requests
# Demonstrates error when requesting more memory than available
# Expected: Pods cannot be scheduled, error shows insufficient memory
#
# QUICK START:
# 1. Apply this scenario:
#    kubectl apply -f 02-high-memory.yaml
#
# 2. Check pod status:
#    kubectl get pods -l app.kubernetes.io/part-of=resource-error-high-memory
#
# 3. View the error details:
#    kubectl describe pod <pod-name> | grep -A 5 Events
#
# 4. Check PodCliqueSet status:
#    kubectl get pcs resource-error-high-memory -o yaml | grep -A 10 lastErrors
#
# 5. (Optional) Use grovectl for better output:
#    grovectl describe pcs resource-error-high-memory
#
# 6. Clean up:
#    kubectl delete pcs resource-error-high-memory
#
# EXPECTED BEHAVIOR:
# - Pods will remain in Pending state
# - Error will show 'Insufficient memory'
# - Gang scheduling will be blocked due to resource constraints
# - PCS status.operationalSummary.phase will be 'Blocked'
---
---
apiVersion: grove.io/v1alpha1
kind: PodCliqueSet
metadata:
  name: resource-error-high-memory
  namespace: default
  labels:
    app: resource-error-high-memory
    demo: group4-resources
    scenario: 02-high-memory
spec:
  replicas: 1
  template:
    cliques:
      # PodClique with excessive memory request - blocks gang scheduling
      - name: data-processor
        spec:
          roleName: data-processor
          replicas: 2
          podSpec:
            containers:
              - name: data-processor
                image: nginx:latest
                resources:
                  # Request 1Ti memory (way more than any cluster has)
                  requests:
                    cpu: 10m
                    memory: "1Ti"
      # Healthy PodClique with normal memory - schedule-gated waiting for gang
      - name: api
        spec:
          roleName: api
          replicas: 2
          podSpec:
            containers:
              - name: api
                image: nginx:latest
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
